<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你适合什么样的恋人？｜天命情书</title>
<style>
  :root{
    --bg1:#fff0f5; --bg2:#ffe2ee;
    --gold:#c25e8c; --gold-soft:#e88ab0; --gold-text:#b85c7e;
    --rose:#d68aa8; --rose-soft:#e88ab0;
    --text:#5a2a3e; --muted:#946880;
    --card:rgba(255,255,255,0.62); --card-line:rgba(214,138,168,0.55);
  }
  html{ min-height:100%; }

  .petals{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
  .petal{position:absolute;top:-60px;opacity:0.35;pointer-events:none;animation:fall linear infinite;}
  @keyframes fall{0%{transform:translateY(0) rotate(0deg) scale(0.8);opacity:0.4;}
    50%{opacity:0.25;}100%{transform:translateY(110vh) rotate(720deg) scale(0.4);opacity:0;}}
  @keyframes sway{0%,100%{margin-left:0;}50%{margin-left:30px;}}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background-color:#fff3f7;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 12%, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 15% 28%, rgba(255,255,255,.6), transparent),
      radial-gradient(2px 2px at 22% 8%, rgba(214,138,168,.55), transparent),
      radial-gradient(1px 1px at 30% 35%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 38% 18%, rgba(255,255,255,.85), transparent),
      radial-gradient(1px 1px at 45% 44%, rgba(255,255,255,.55), transparent),
      radial-gradient(2px 2px at 52% 10%, rgba(214,138,168,.5), transparent),
      radial-gradient(1px 1px at 60% 30%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 68% 16%, rgba(255,255,255,.85), transparent),
      radial-gradient(1px 1px at 75% 40%, rgba(255,255,255,.55), transparent),
      radial-gradient(2px 2px at 82% 12%, rgba(214,138,168,.5), transparent),
      radial-gradient(1px 1px at 90% 32%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 95% 20%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 10% 52%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 18% 64%, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 26% 78%, rgba(255,255,255,.55), transparent),
      radial-gradient(2px 2px at 34% 58%, rgba(214,138,168,.45), transparent),
      radial-gradient(1px 1px at 42% 86%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 50% 70%, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 58% 90%, rgba(255,255,255,.55), transparent),
      radial-gradient(2px 2px at 66% 62%, rgba(214,138,168,.45), transparent),
      radial-gradient(1px 1px at 74% 82%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 82% 70%, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 90% 88%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 95% 75%, rgba(255,255,255,.7), transparent),
      linear-gradient(180deg, #fff0f5 0%, #ffe2ee 100%);
    background-attachment: fixed;
    color:var(--text);
    min-height:100vh;
    margin:0;
    display:flex; justify-content:center;
    padding:26px 16px 76px;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }
  #app{ width:100%; max-width:480px; }
  .title{
    font-size:27px; font-weight:800; text-align:center; line-height:1.35; margin:6px 0 10px;
    background:linear-gradient(90deg,var(--gold-soft),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{ text-align:center; color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:26px; }
  .start-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:18px;
    padding:30px 22px; text-align:center; margin-top:18px;
  }
  .start-card .badge{
    display:inline-block; font-size:12px; color:var(--gold-text); border:1px solid var(--card-line);
    border-radius:999px; padding:5px 14px; margin-bottom:16px; letter-spacing:1px;
  }
  .start-card p{ color:var(--muted); font-size:14px; line-height:1.8; margin:0 0 22px; }
  .progress{ height:6px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; margin:14px 0 20px; }
  .progress > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--rose)); transition:width .35s ease; }
  .q-count{ text-align:center; color:var(--muted); font-size:13px; margin-bottom:4px; letter-spacing:1px; }
  .q-text{ font-size:19px; font-weight:700; text-align:center; line-height:1.5; margin:6px 4px 22px; }
  .opt{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--card-line);
    color:var(--text); border-radius:14px; padding:15px 16px; margin:11px 0; font-size:15.5px; line-height:1.55;
    cursor:pointer; transition:.18s; font-family:inherit;
  }
  .opt:active, .opt:hover{ border-color:var(--gold); background:rgba(214,138,168,0.20); transform:translateY(-1px); }
  .opt.sel{ border-color:var(--gold); background:rgba(214,138,168,0.26); box-shadow:0 0 0 1px var(--gold) inset; }
  .next-btn{
    display:none; width:100%; margin-top:14px; padding:15px; border:none; border-radius:14px;
    background:linear-gradient(90deg,var(--gold-soft),var(--gold)); color:#2a1c10; font-size:16px; font-weight:800;
    cursor:pointer; font-family:inherit; box-shadow:0 6px 18px rgba(194,94,140,0.30);
  }
  .next-btn.show{ display:block; }
  .result-btn{
    display:block; width:100%; margin:8px auto 0; padding:14px; border:none; border-radius:16px;
    background:linear-gradient(90deg,var(--gold-soft),var(--gold)); color:#2a1c10; font-size:16px; font-weight:800;
    cursor:pointer; font-family:inherit; box-shadow:0 8px 22px rgba(194,94,140,0.35);
  }
  .nav-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:20px; }
  .nav-circle{
    width:54px; height:54px; border-radius:50%; border:2px solid var(--gold);
    background:rgba(255,255,255,0.7); color:var(--gold); font-size:30px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; transition:.15s;
  }
  .nav-circle:active{ transform:scale(0.93); }
  .nav-circle:disabled{ opacity:0.32; cursor:default; border-color:var(--muted); color:var(--muted); background:rgba(255,255,255,0.4); }
  .nav-circle[aria-label="完成"]{ background:linear-gradient(135deg,var(--gold-soft),var(--gold)); color:#fff; border-color:var(--gold); }
  .nav-hint{ font-size:13px; color:var(--muted); min-width:128px; text-align:center; }
  .r-head{ text-align:center; margin:4px 0 18px; }
  .r-badge{ font-size:12px; color:var(--gold-text); border:1px solid var(--card-line); border-radius:999px; padding:5px 14px; letter-spacing:1px; }
  .r-name{ font-size:30px; font-weight:800; margin:14px 0 4px;
    background:linear-gradient(90deg,var(--gold-soft),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .r-nick{ font-size:15px; color:var(--muted); margin-bottom:6px; letter-spacing:1px; }
  .r-tag{ font-size:14.5px; color:var(--muted); line-height:1.6; }
  .r-match{ text-align:center; font-size:13px; color:var(--muted); margin:14px 0 4px; }
  .r-match b{ font-size:30px; color:var(--gold); font-weight:800; }
  .sec-title{ font-size:15px; font-weight:700; color:var(--gold-text); margin:22px 0 12px; display:flex; align-items:center; }
  .sec-title::before{ content:""; width:4px; height:15px; background:var(--gold); border-radius:2px; margin-right:8px; }
  .card{ background:var(--card); border:1px solid var(--card-line); border-radius:14px; padding:16px; line-height:1.75; font-size:14.5px; color:var(--text); }
  .card.why{ background:rgba(214,138,168,0.16); }
  .bar-row{ margin:13px 0; }
  .bar-top{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px; }
  .bar-top .v{ color:var(--gold); font-weight:700; }
  .bar{ height:9px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--gold),var(--rose)); }
  .bar-note{ font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.6; }
  .kw{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 2px; }
  .kw span{ font-size:12.5px; color:var(--gold-text); border:1px solid var(--card-line); border-radius:999px; padding:4px 11px; }
  .sec-sub{ font-size:13px; color:var(--muted); margin:2px 0 10px; line-height:1.6; }
  .retake{ display:block; width:100%; margin:26px auto 0; padding:14px; background:none; border:1px solid var(--card-line); color:var(--muted); border-radius:14px; font-size:14px; cursor:pointer; font-family:inherit; }
  .page-foot{ position:fixed; bottom:0; left:0; right:0; text-align:center; font-size:12px; color:var(--muted); background:rgba(255,243,247,0.94); padding:9px 0; letter-spacing:1px; z-index:20; border-top:1px solid var(--card-line); }
</style>
</head>

<script>

  {k:'B', label:'情感表达',
    note:v=> v>=70?'你习惯把爱说出口，也需要明确的情感回应。': v>=40?'你愿意表达，但更看重分寸。':'你偏内敛，爱多用行动而非言语。'},
  {k:'C', label:'关系节奏',

];

      <button class="nav-circle" id="navRight" onclick="${last?'finish()':'next()'}" ${answered?'':'disabled'} aria-label="${last?'完成':'下一题'}">${last?'完':'›'}</button>
    </div>`;
  app.innerHTML = html;
}

function choose(i){
  ans[cur] = i;
  document.querySelectorAll('.opt').forEach((el,idx)=> el.classList.toggle('sel', idx===i));
  const right = document.getElementById('navRight');
  if(right) right.removeAttribute('disabled');
  const hint = document.getElementById('navHint');
  if(hint) hint.textContent = (cur===QUESTIONS.length-1) ? '完成测试 · 点右圈' : '已选好 · 可前进';
  if(advTimer) clearTimeout(advTimer);
  const last = cur === QUESTIONS.length-1;
  advTimer = setTimeout(()=>{ if(advTimer){ advTimer=null; last ? finish() : next(); } }, 380);
}

function prevQ(){
  if(advTimer){ clearTimeout(advTimer); advTimer=null; }
  if(cur===0) return;
  cur--;
  renderQ();
}

function next(){
  if(advTimer){ clearTimeout(advTimer); advTimer=null; }
  if(ans[cur] === undefined) return;
  cur++;
  if(cur >= QUESTIONS.length){ finish(); return; }
  renderQ();
}

function finish(){
  if(advTimer){ clearTimeout(advTimer); advTimer=null; }
  for(let k=0;k<QUESTIONS.length;k++){
    if(ans[k]===undefined){ cur=k; renderQ(); return; }
  }
  const sc = {A:0,B:0,C:0,D:0,E:0};
  QUESTIONS.forEach((q,ki)=>{
    const idx = ans[ki];
    const opt = q.opts[idx];
    if(!opt || !opt.v) return;
    for(const kk in opt.v){ sc[kk] += opt.v[kk]; }
  });
  AXES.forEach(a=>{ sc[a.k] = Math.round(sc[a.k]/4); });

  const DMAX = Math.sqrt(5*100*100);
  const ranked = Object.keys(TYPES).map(key=>{
    const p = TYPES[key].p;
    let d = 0, l1 = 0;
    AXES.forEach(a=>{ const diff = sc[a.k]-p[a.k]; d += diff*diff; l1 += Math.abs(diff); });
    d = Math.sqrt(d);
    const sim = Math.max(58, Math.min(99, Math.round(100*(1 - d/DMAX))));
    return {key, d, l1, sim};
  }).sort((x,y)=> (x.d - y.d) || (x.l1 - y.l1) || (x.key < y.key ? -1 : 1));

  renderResult(sc, ans, ranked[0]);
}

function whyText(sc, ans, mainKey){
  const sorted = AXES.slice().sort((a,b)=> sc[b.k]-sc[a.k]);
  const hi1 = sorted[0], hi2 = sorted[1], lo = sorted[4];
  function pick(axis, wantHigh){
    let best = null, score = null;
    QUESTIONS.forEach((q,qi)=>{
      if(q.axis !== axis) return;
      const idx = ans[qi]; const opt = q.opts[idx]; if(!opt) return;
      const v = opt.v[axis];
      const s = wantHigh ? v : (100 - v);
      if(score===null || s>score){ score = s; best = {q:q.q, t:opt.t}; }
    });
    return best;
  }
  const h1 = pick(hi1.k, true), h2 = pick(hi2.k, true), l = pick(lo.k, false);
  let s = `你的关系画像里，<b>${hi1.label} ${sc[hi1.k]}</b> 与 <b>${hi2.label} ${sc[hi2.k]}</b> 最突出：`;
  s += `你在「${h1.q}」选了「${h1.t}」；在「${h2.q}」选了「${h2.t}」。`;
  s += `而 <b>${lo.label} ${sc[lo.k]}</b> 偏低——你在「${l.q}」选了「${l.t}」。这几笔，正好勾出「${TYPES[mainKey].type}」的你。`;
  return s;
}

function barsHTML(sc){
  let h = '';
  AXES.forEach(a=>{
    const v = sc[a.k];
    h += `
      <div class="bar-row">
        <div class="bar-top"><span>${a.label}</span><span class="v">${v}</span></div>
        <div class="bar"><i style="width:${v}%"></i></div>
        <div class="bar-note">${a.note(v)}</div>
      </div>`;
  });
  return h;
}

function renderResult(sc, ans, main){
  const T = TYPES[main.key];
  const app = document.getElementById('app');
  let html = `
    <div class="r-head">
      <div class="r-badge">天命情书 · 你的恋人原型</div>
      <div class="r-name">${T.type}</div>
      <div class="r-nick">${T.nick}</div>
      <div class="r-tag">${T.tag}</div>
      <div class="r-match">与你的契合度 <b>${main.sim}%</b></div>
    </div>

    <div class="sec-title">你的关系画像</div>
    <div class="sec-sub">五项维度由你的真实作答算出，是这份匹配的依据：</div>
    ${barsHTML(sc)}

    <div class="sec-title">为什么是你</div>
    <div class="card why">${whyText(sc, ans, main.key)}</div>

    <div class="sec-title">TA 是什么样的恋人</div>
    <div class="card">${T.desc}</div>
    <div class="kw">${T.kw.map(k=>`<span>${k}</span>`).join('')}</div>

    <div class="sec-title">你们在一起会</div>
    <div class="card">${T.together}</div>

    <div class="sec-title">你最怕什么</div>
    <div class="card">${T.fear}</div>

    <div class="sec-title">心动信号</div>
    <div class="card">${T.signal}</div>

    <div class="sec-title">要留意的雷区</div>
    <div class="card">${T.pit}</div>

    <div class="sec-title">现实里怎么认出 TA</div>
    <div class="card">${T.spot}</div>

    <button class="retake" onclick="start()">重新测试</button>
  `;
  app.innerHTML = html;
  window.scrollTo(0,0);
}
