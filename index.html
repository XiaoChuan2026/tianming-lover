/* ============ 状态与流程 ============ */
let cur = 0;
const ans = {};

function start(){
  cur = 0;
  for(const k in ans) delete ans[k];
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="start-card">
      <div class="badge">天命情书 · 恋人匹配</div>
      <div class="title" style="font-size:24px">你适合<br>什么样的恋人？</div>
      <p>20 道真实关系题，从「亲密需求 / 情感表达 / 关系节奏 / 被呵护偏好 / 成长张力」五个维度，为你算出最契合的恋人原型，并告诉你：为什么是你、TA 长什么样、你们在一起会怎样、以及现实里怎么认出 TA。</p>
      <button class="result-btn" onclick="renderQ()">开始测试</button>
    </div>`;
}

function renderQ(){
  const q = QUESTIONS[cur];
  const app = document.getElementById('app');
  const total = QUESTIONS.length;
  const pct = Math.round((cur)/total*100);
  const last = cur === total-1;
  const answered = ans[cur] !== undefined;
  let html = `
    <div class="q-count">第 ${cur+1} / ${total} 题</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="q-text">${q.q}</div>`;
  q.opts.forEach((o, i)=>{
    const sel = ans[cur]===i ? ' sel' : '';
    html += `<button class="opt${sel}" onclick="choose(${i})">${o.t}</button>`;
  });
  html += `
    <div class="nav-row">
      <button class="nav-circle" onclick="prevQ()" ${cur===0?'disabled':''} aria-label="上一题">‹</button>
      <span class="nav-hint" id="navHint">${answered ? (last?'完成测试 · 点右圈':'已选好 · 可前进') : '请选择一个答案'}</span>
      <button class="nav-circle" id="navRight" onclick="${last?'finish()':'next()'}" ${answered?'':'disabled'} aria-label="${last?'完成':'下一题'}">${last?'✓':'›'}</button>
    </div>`;
  app.innerHTML = html;
}

function choose(i){
  ans[cur] = i;
  document.querySelectorAll('.opt').forEach((el,idx)=> el.classList.toggle('sel', idx===i));
  const right = document.getElementById('navRight');
  if(right) right.removeAttribute('disabled');
  const hint = document.getElementById('navHint');
  if(hint) hint.textContent = (cur===QUESTIONS.length-1) ? '完成测试 · 点右圈' : '已选好 · 可前进';
}

function prevQ(){
  if(cur===0) return;
  cur--;
  renderQ();
}

function next(){
  if(ans[cur] === undefined) return;
  cur++;
  if(cur >= QUESTIONS.length){ finish(); return; }
  renderQ();
}

function finish(){
  // 防御：缺答则跳到该题
  for(let k=0;k<QUESTIONS.length;k++){
    if(ans[k]===undefined){ cur=k; renderQ(); return; }
  }
  const sc = {A:0,B:0,C:0,D:0,E:0};
  QUESTIONS.forEach((q,ki)=>{
    const idx = ans[ki];
    const opt = q.opts[idx];
    if(!opt || !opt.v) return;
    for(const kk in opt.v){ sc[kk] += opt.v[kk]; }
  });
  // 每维度 4 题取平均
  AXES.forEach(a=>{ sc[a.k] = Math.round(sc[a.k]/4); });

  const DMAX = Math.sqrt(5*100*100);
  const ranked = Object.keys(TYPES).map(key=>{
    const p = TYPES[key].p;
    let d = 0;
    AXES.forEach(a=>{ const diff = sc[a.k]-p[a.k]; d += diff*diff; });
    d = Math.sqrt(d);
    const sim = Math.max(58, Math.min(99, Math.round(100*(1 - d/DMAX))));
    return {key, d, sim};
  }).sort((x,y)=> x.d - y.d);

  renderResult(sc, ranked[0], ranked[1]);
}

function whyText(sc, mainKey){
  const sorted = AXES.slice().sort((a,b)=> sc[b.k]-sc[a.k]);
  const t1=sorted[0], t2=sorted[1], lo=sorted[4];
  return `你的关系画像里，<b>${t1.label} ${sc[t1.k]}</b> 与 <b>${t2.label} ${sc[t2.k]}</b> 最突出，而 <b>${lo.label} ${sc[lo.k]}</b> 偏低——${TYPES[mainKey].fit}`;
}

function barsHTML(sc){
  let h = '';
  AXES.forEach(a=>{
    const v = sc[a.k];
    h += `
      <div class="bar-row">
        <div class="bar-top"><span>${a.label}</span><span class="v">${v}</span></div>
        <div class="bar"><i style="width:${v}%"></i></div>
        <div class="bar-note">${a.note(v)}</div>
      </div>`;
  });
  return h;
}

function renderResult(sc, main, second){
  const T = TYPES[main.key];
  const S = TYPES[second.key];
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="r-head">
      <div class="r-badge">天命情书 · 你的恋人原型</div>
      <div class="r-name">${T.name}</div>
      <div class="r-tag">${T.tag}</div>
      <div class="r-match">与你的契合度 <b>${main.sim}%</b></div>
    </div>

    <div class="sec-title">你的关系画像</div>
    <div class="sec-sub">五项维度由你的真实作答算出，是这份匹配的依据：</div>
    ${barsHTML(sc)}

    <div class="sec-title">为什么是你</div>
    <div class="card why">${whyText(sc, main.key)}</div>

    <div class="sec-title">TA 是什么样的恋人</div>
    <div class="card">${T.desc}</div>
    <div class="kw">${T.kw.map(k=>`<span>${k}</span>`).join('')}</div>

    <div class="sec-title">你们在一起会</div>
    <div class="card">${T.together}</div>

    <div class="sec-title">要留意的雷区</div>
    <div class="card">${T.pit}</div>

    <div class="sec-title">现实里怎么认出 TA</div>
    <div class="card">${T.spot}</div>

    <div class="sec-title">你的第二适配恋人</div>
    <div class="sub-card">
      <span class="sm">契合度 ${second.sim}%</span>
      <div class="sn">${S.name}</div>
      <div class="st">${S.tag}</div>
    </div>

    <button class="retake" onclick="start()">重新测试</button>
    <div class="foot">本测试为独立内容，仅供娱乐与自我觉察参考。<br>天命情书 · 你适合什么样的恋人？</div>
  `;
  window.scrollTo(0,0);
}

start();
</script>
